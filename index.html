<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muroja'ahKu Tracker API</title>
    
    <style>
        /* CSS umum */
        body { background-color: #f4f4f4; margin: 0; padding: 0; font-family: sans-serif; }
        .app-container { padding: 20px; max-width: 800px; margin: 30px auto; border: 4px solid #4CAF50; border-radius: 12px; background-color: white; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); overflow: hidden; }
        .main-header { text-align: center; color: #4CAF50; font-size: 2.5em; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        
        /* Navigasi Kalender */
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background-color: #f0f0f0; padding: 10px; border-radius: 8px; }
        .nav-button { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 1.2em; transition: background-color 0.2s; }
        .nav-button:hover { background-color: #0056b3; }
        
        /* Tampilan Bulan & Tahun yang dapat di-klik */
        .month-year-select { 
            font-size: 1.2em; 
            font-weight: bold; 
            color: #333; 
            cursor: pointer; 
            padding: 5px 10px; 
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .month-year-select:hover {
            background-color: #e0e0e0;
        }

        /* Tombol 'Hari Ini' */
        .top-controls {
            display: flex;
            justify-content: flex-end; 
            margin-bottom: 10px;
        }
        .today-button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s;
        }
        .today-button:hover {
            background-color: #e68900;
        }

        /* Container Dropdown Bulan/Tahun */
        #month-year-dropdown {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1010;
            display: flex;
            gap: 10px;
        }
        #month-year-dropdown select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        #month-year-dropdown button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* Kontrol Aksi Bawah Kalender */
        .app-controls { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            padding-top: 15px; 
            margin-top: 20px; 
        }
        
        /* Tombol Aksi Paling Bawah */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            margin-top: 20px;
            border-top: 1px solid #eee;
        }
        .info-button { 
            background-color: #00bcd4; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background-color 0.2s; 
            font-weight: bold;
        }
        .info-button:hover {
             background-color: #0097a7;
        }
        .privacy-button { 
            background-color: #6c757d; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background-color 0.2s; 
            font-weight: bold;
        }
        .privacy-button:hover {
             background-color: #5a6268;
        }


        /* Modal & Scrolling */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-height: 90vh; overflow-y: auto; width: 90%; max-width: 800px; }
        
        /* Font Arab */
        .surah-text-display pre { 
            white-space: pre-wrap; 
            font-size: 1.5em; 
            font-family: 'Amiri', 'Traditional Arabic', 'Times New Roman', serif; 
            text-align: right; 
            line-height: 2.5; 
            margin: 0; 
        }

        /* Gaya Kalender */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 20px; border: 1px solid #ccc; padding: 10px; background-color: #ffffff; }
        .day-label { text-align: center; font-weight: bold; color: #6c757d; padding: 5px 0; font-size: 0.8em; }
        .calendar-day { background-color: #f0f0f0; padding: 10px 5px; text-align: center; border-radius: 5px; cursor: pointer; position: relative; min-height: 40px; display: flex; justify-content: center; align-items: center; font-size: 0.9em; transition: background-color 0.2s; }
        .calendar-day.today { border: 2px solid #007bff; font-weight: bold; }
        .calendar-day.has-data { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .indicator { position: absolute; top: 2px; right: 2px; color: green; font-size: 0.9em; }
        .delete-all-button { background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: background-color 0.2s; font-weight: bold; }
        
    </style>
</head>
<body>
    <div class="app-container">
        <h1 class="main-header">MurojaahKu</h1> 
        <h1>📚 Muroja'ah Tracker Online</h1>
        
        <div id="calendar-nav-root"></div>
        
        <div id="month-year-select-container"></div>
        
        <div class="top-controls">
            <button class="today-button" onclick="goToToday()">Hari Ini</button>
        </div>

        <div id="calendar-root"></div>
        
        <div class="app-controls">
            <button class="delete-all-button" onclick="deleteAllData()">Hapus SELURUH Data</button>
        </div>

        <div class="bottom-controls">
            <button class="info-button" onclick="showAboutWebsite()">Tentang Website & Fitur</button>
            <button class="privacy-button" onclick="showPrivacyPolicy()">Privacy Policy</button>
        </div>
        
        <div id="modal-root"></div>
        <div id="progress-view-root"></div>
    </div>

    <script>
        // --- A. Hook/Fungsi: Manajemen Local Storage & State ---
        const LOCAL_STORAGE_KEY = 'quranProgressVanilla';
        const DAYS_OF_WEEK = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        
        function getProgressData() {
            try {
                const item = localStorage.getItem(LOCAL_STORAGE_KEY);
                return item ? JSON.parse(item) : {};
            } catch (error) {
                console.error("Gagal membaca localStorage:", error);
                return {};
            }
        }

        function saveProgressData(data) {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
            } catch (error) {
                console.error("Gagal menulis ke localStorage:", error);
            }
        }

        let progressData = getProgressData();
        let isModalOpen = false;
        let selectedDate = '';
        let modalStep = 'JUZ';
        let modalSelection = { juz: null, surah: null, catatan: '' };
        let isLoading = false;
        
        // State untuk Kalender
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let isDropdownOpen = false;

        // --- B. DATA MOCK (Untuk mapping Juz ke Surah) & API Fetch ---
        const JUZ_DATA = [

            { id: 4, name: "Juz 4: Lan Tanaalu", surahs: [{ id: 3, name: "Ali 'Imran (93-200)", verses: 108 }, { id: 4, name: "An-Nisa (1-23)", verses: 23 }] },

            { id: 16, name: "Juz 16: Qala Alam", surahs: [{ id: 18, name: "Al-Kahf (75-110)", verses: 36 }, { id: 19, name: "Maryam", verses: 98 }, { id: 20, name: "Taha (1-135)", verses: 135 }] },
            { id: 17, name: "Juz 17: Iqtaraba Li-n-Nasi", surahs: [{ id: 21, name: "Al-Anbiya", verses: 112 }, { id: 22, name: "Al-Hajj", verses: 78 }] },
            { id: 18, name: "Juz 18: Qad Aflaha", surahs: [{ id: 23, name: "Al-Mu'minun", verses: 118 }, { id: 24, name: "An-Nur", verses: 64 }, { id: 25, name: "Al-Furqan (1-20)", verses: 20 }] },
            { id: 19, name: "Juz 19: Wa Ma Liya", surahs: [{ id: 25, name: "Al-Furqan (21-77)", verses: 57 }, { id: 26, name: "Asy-Syu'ara", verses: 227 }, { id: 27, name: "An-Naml (1-55)", verses: 55 }] },
            { id: 20, name: "Juz 20: A'man Khalaqa", surahs: [{ id: 27, name: "An-Naml (56-93)", verses: 38 }, { id: 28, name: "Al-Qasas (1-88)", verses: 88 }, { id: 29, name: "Al-Ankabut (1-45)", verses: 45 }] },
            { id: 21, name: "Juz 21: Utlu Ma Uhiya", surahs: [{ id: 29, name: "Al-Ankabut (46-69)", verses: 24 }, { id: 30, name: "Ar-Rum", verses: 60 }, { id: 31, name: "Luqman", verses: 34 }, { id: 32, name: "As-Sajdah", verses: 30 }, { id: 33, name: "Al-Ahzab (1-30)", verses: 30 }] },

            { id: 24, name: "Juz 24: Faman Azlamu", surahs: [{ id: 39, name: "Az-Zumar (32-75)", verses: 44 }, { id: 40, name: "Ghafir", verses: 85 }, { id: 41, name: "Fussilat (1-46)", verses: 46 }] },
            { id: 25, name: "Juz 25: Ilayhi Yuraddu", surahs: [{ id: 41, name: "Fussilat (47-54)", verses: 8 }, { id: 42, name: "Asy-Syura", verses: 53 }, { id: 43, name: "Az-Zukhruf", verses: 89 }, { id: 44, name: "Ad-Dukhan", verses: 59 }, { id: 45, name: "Al-Jasiyah", verses: 37 }] },
            { id: 26, name: "Juz 26: Ha Mim", surahs: [{ id: 46, name: "Al-Ahqaf", verses: 35 }, { id: 47, name: "Muhammad", verses: 38 }, { id: 48, name: "Al-Fath", verses: 29 }, { id: 49, name: "Al-Hujurat", verses: 18 }, { id: 50, name: "Qaf", verses: 45 }, { id: 51, name: "Adz-Dzariyat (1-30)", verses: 30 }] },
            { id: 27, name: "Juz 27: Qala Fama Khatbukum", surahs: [{ id: 51, name: "Adz-Dzariyat (31-60)", verses: 30 }, { id: 52, name: "At-Tur", verses: 49 }, { id: 53, name: "An-Najm", verses: 62 }, { id: 54, name: "Al-Qamar", verses: 55 }, { id: 55, name: "Ar-Rahman", verses: 78 }, { id: 56, name: "Al-Waqi'ah", verses: 96 }, { id: 57, name: "Al-Hadid", verses: 29 }] },
            { id: 28, name: "Juz 28: Qad Sami'a Allahu", surahs: [{ id: 58, name: "Al-Mujadilah", verses: 22 }, { id: 59, name: "Al-Hasyr", verses: 24 }, { id: 60, name: "Al-Mumtahanah", verses: 13 }, { id: 61, name: "As-Saff", verses: 14 }, { id: 62, name: "Al-Jumu'ah", verses: 11 }, { id: 63, name: "Al-Munafiqun", verses: 11 }, { id: 64, name: "At-Taghabun", verses: 18 }, { id: 65, name: "At-Talaq", verses: 12 }, { id: 66, name: "At-Tahrim", verses: 12 }] },
            { id: 29, name: "Juz 29: Tabarakalladzi", surahs: [{ id: 67, name: "Al-Mulk", verses: 30 }, { id: 68, name: "Al-Qalam", verses: 52 }, { id: 69, name: "Al-Haqqah", verses: 52 }, { id: 70, name: "Al-Ma'arij", verses: 44 }, { id: 71, name: "Nuh", verses: 28 }, { id: 72, name: "Al-Jinn", verses: 28 }, { id: 73, name: "Al-Muzammil", verses: 20 }, { id: 74, name: "Al-Muddassir", verses: 56 }, { id: 75, name: "Al-Qiyamah", verses: 40 }, { id: 76, name: "Al-Insan", verses: 31 }, { id: 77, name: "Al-Mursalat", verses: 50 }] },
            { id: 30, name: "Juz 30: Amma Yatasa'alun", surahs: [{ id: 78, name: "An-Naba", verses: 40 }, { id: 79, name: "An-Naziat", verses: 46 }, { id: 80, name: "Abasa", verses: 42 }, { id: 81, name: "At-Takwir", verses: 29 }, { id: 82, name: "Al-Infitar", verses: 19 }, { id: 83, name: "Al-Mutaffifin", verses: 36 }, { id: 84, name: "Al-Insyiqaq", verses: 25 }, { id: 85, name: "Al-Buruj", verses: 22 }, { id: 86, name: "At-Tariq", verses: 17 }, { id: 87, name: "Al-A'la", verses: 19 }, { id: 88, name: "Al-Ghasyiyah", verses: 26 }, { id: 89, name: "Al-Fajr", verses: 30 }, { id: 90, name: "Al-Balad", verses: 20 }, { id: 91, name: "Asy-Syams", verses: 15 }, { id: 92, name: "Al-Lail", verses: 21 }, { id: 93, name: "Ad-Duha", verses: 11 }, { id: 94, name: "Al-Insyirah", verses: 8 }, { id: 95, name: "At-Tin", verses: 8 }, { id: 96, name: "Al-Alaq", verses: 19 }, { id: 97, name: "Al-Qadr", verses: 5 }, { id: 98, name: "Al-Bayyinah", verses: 8 }, { id: 99, name: "Az-Zalzalah", verses: 8 }, { id: 100, name: "Al-Adiyat", verses: 11 }, { id: 101, name: "Al-Qari'ah", verses: 11 }, { id: 102, name: "At-Takasur", verses: 8 }, { id: 103, name: "Al-Asr", verses: 3 }, { id: 104, name: "Al-Humazah", verses: 9 }, { id: 105, name: "Al-Fil", verses: 5 }, { id: 106, name: "Quraisy", verses: 4 }, { id: 107, name: "Al-Ma'un", verses: 7 }, { id: 108, name: "Al-Kausar", verses: 3 }, { id: 109, name: "Al-Kafirun", verses: 6 }, { id: 110, name: "An-Nasr", verses: 3 }, { id: 111, name: "Al-Lahab", verses: 5 }, { id: 112, name: "Al-Ikhlas", verses: 4 }, { id: 113, name: "Al-Falaq", verses: 5 }, { id: 114, name: "An-Nas", verses: 6 }] }
        ];

        
        const fetchJuzList = () => Promise.resolve(JUZ_DATA);

        const fetchSurahText = async (surahId, surahName) => {
            const API_URL = `https://api.alquran.cloud/v1/surah/${surahId}/ar.uthmani`;
            
            try {
                isLoading = true; renderModal();
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`Gagal mengambil data dari API (Status: ${response.status}).`);
                }
                const data = await response.json();
                
                let surahText = `بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\n\n`;
                
                if (data.data && data.data.ayahs) {
                    data.data.ayahs.forEach(ayah => {
                        surahText += `${ayah.text} ﴿${ayah.numberInSurah}﴾\n\n`;
                    });
                } else {
                    surahText = `Data Ayat tidak ditemukan untuk ${surahName} (${surahId}).`;
                }

                return surahText;
            } catch (error) {
                console.error("Kesalahan Fetch API:", error);
                return `[ERROR DATA API] Gagal memuat konten Al-Qur'an untuk Surah ${surahName}.\nSilakan coba lagi atau pastikan perangkat Anda terhubung ke internet. \n\nDetail: ${error.message}`;
            } finally {
                isLoading = false; 
            }
        };

        // --- C. Fungsi Render Kalender dan Navigasi ---
        
        function renderCalendarNav() {
            const navRoot = document.getElementById('calendar-nav-root');
            navRoot.innerHTML = `
                <div class="calendar-nav">
                    <button class="nav-button" onclick="changeMonth(-1)">&#9664;</button>
                    <span class="month-year-select" onclick="toggleMonthYearDropdown(event)">
                        ${MONTHS[currentMonth]} ${currentYear}
                    </span>
                    <button class="nav-button" onclick="changeMonth(1)">&#9654;</button>
                </div>
            `;
            // Pastikan dropdown di-render ulang
            renderMonthYearDropdown();
        }

        function toggleMonthYearDropdown(event) {
            event.stopPropagation();
            isDropdownOpen = !isDropdownOpen;
            renderMonthYearDropdown();
        }
        
        function renderMonthYearDropdown() {
            const container = document.getElementById('month-year-select-container');
            if (!isDropdownOpen) {
                container.innerHTML = '';
                // Hapus listener jika dropdown ditutup
                document.body.removeEventListener('click', closeDropdownOnOutsideClick);
                return;
            }

            const monthOptions = MONTHS.map((m, i) => 
                `<option value="${i}" ${i === currentMonth ? 'selected' : ''}>${m}</option>`
            ).join('');
            
            const currentYearValue = currentYear;
            let yearOptions = '';
            // Tampilkan tahun dari 10 tahun ke belakang hingga 5 tahun ke depan
            for (let y = currentYearValue - 10; y <= currentYearValue + 5; y++) {
                yearOptions += `<option value="${y}" ${y === currentYearValue ? 'selected' : ''}>${y}</option>`;
            }

            // Tentukan posisi dropdown di bawah elemen span yang diklik (sedikit tricky di vanilla JS, tapi kita letakkan di bawah container kalender)
            container.innerHTML = `
                <div id="month-year-dropdown" style="margin-top: -10px; margin-left: 20px;">
                    <select id="month-select">${monthOptions}</select>
                    <select id="year-select">${yearOptions}</select>
                    <button onclick="applyMonthYear()">Go</button>
                </div>
            `;
            
            // Tambahkan listener untuk menutup dropdown saat klik di luar
            // Ini harus dilakukan setelah dropdown dibuat di DOM
            setTimeout(() => {
                document.body.addEventListener('click', closeDropdownOnOutsideClick);
            }, 0);
        }

        function closeDropdownOnOutsideClick(event) {
            const dropdown = document.getElementById('month-year-dropdown');
            const selectButton = document.querySelector('.month-year-select');

            if (dropdown && !dropdown.contains(event.target) && !selectButton.contains(event.target)) {
                isDropdownOpen = false;
                renderMonthYearDropdown();
                document.body.removeEventListener('click', closeDropdownOnOutsideClick);
            }
        }

        function applyMonthYear() {
            const monthSelect = document.getElementById('month-select');
            const yearSelect = document.getElementById('year-select');
            
            currentMonth = parseInt(monthSelect.value);
            currentYear = parseInt(yearSelect.value);
            
            isDropdownOpen = false;
            renderApp();
        }
        
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            // Tutup dropdown jika sedang terbuka
            isDropdownOpen = false;
            renderApp();
        }
        
        // FUNGSI INTI: Kembali ke hari ini
        function goToToday() {
            const today = new Date();
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            // Tutup dropdown jika sedang terbuka
            isDropdownOpen = false;
            renderApp();
        }


        function renderCalendar() {
            const root = document.getElementById('calendar-root');
            root.innerHTML = '';
            
            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date().toISOString().slice(0, 10);
            
            const calendarGrid = document.createElement('div');
            calendarGrid.className = 'calendar-grid';

            DAYS_OF_WEEK.forEach(day => {
                const label = document.createElement('div');
                label.className = 'day-label';
                label.textContent = day;
                calendarGrid.appendChild(label);
            });

            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day disabled';
                calendarGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateISO = new Date(currentYear, currentMonth, i).toISOString().slice(0, 10);
                
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                dayDiv.textContent = i;
                dayDiv.setAttribute('data-date', dateISO);

                if (dateISO === today) {
                    dayDiv.classList.add('today');
                }
                if (progressData[dateISO] && progressData[dateISO].length > 0) {
                    dayDiv.classList.add('has-data');
                    const indicator = document.createElement('span');
                    indicator.className = 'indicator';
                    indicator.textContent = '✓';
                    dayDiv.appendChild(indicator);
                }

                dayDiv.addEventListener('click', () => handleDateClick(dateISO));
                
                calendarGrid.appendChild(dayDiv);
            }
            
            root.appendChild(calendarGrid);
        }

        // --- D. Fungsi Modal dan Logic ---
        
        async function renderModal() {
            const root = document.getElementById('modal-root');
            if (!isModalOpen) {
                root.innerHTML = '';
                return;
            }

            let contentHTML = '';
            let currentData = progressData[selectedDate] || [];

            if (isLoading && modalStep !== 'REVIEW') { 
                contentHTML = `<p>Memuat daftar Surah...</p><div class="loading-spinner"></div>`; 
            } else if (isLoading && modalStep === 'REVIEW') {
                 contentHTML = `<p>Memuat teks Al-Qur'an dari API...</p><div class="loading-spinner"></div>`;
            }
            else if (modalStep === 'JUZ') {
                let juzListHTML = '';
                const list = await fetchJuzList();
                list.forEach(juz => { 
                    const buttonText = juz.name; 
                    juzListHTML += `<button class="juz-item" data-juz-id="${juz.id}" data-juz-name="${juz.name}">${buttonText}</button>`; 
                });
                
                contentHTML = `<h3>Pilih Juz untuk Muroja'ah (Scroll untuk melihat 30 Juz)</h3><div class="juz-grid">${juzListHTML}</div>`;
            } 
            else if (modalStep === 'SURAH') {
                let surahListHTML = '';
                const list = modalSelection.juz.surahs; 
                
                if (list && list.length === 0) {
                     surahListHTML = `<p>Tidak ada data surah di Juz ini.</p>`;
                } else {
                     list.forEach(surah => { 
                         surahListHTML += `<button class="surah-item" data-surah-id="${surah.id}" data-surah-name="${surah.name}">${surah.name} (${surah.verses} Ayat)</button>`; 
                     });
                }
                
                contentHTML = `<h3>Pilih Surah di ${modalSelection.juz.name} (Scroll jika banyak)</h3><button class="back-button" onclick="setStep('JUZ')">Pilih Juz Lain</button><div class="surah-list">${surahListHTML}</div>`;
            } 
            else if (modalStep === 'REVIEW') {
                const surahText = modalSelection.surah.text || "Gagal memuat teks Al-Qur'an.";
                contentHTML = `
                    <h3>Catatan Muroja'ah: ${modalSelection.surah.name}</h3>
                    <p>Konten di bawah diambil langsung dari API Al-Qur'an:</p>
                    <div class="surah-text-display"><pre>${surahText}</pre></div><hr/>
                    <div class="catatan-section"><h4>Catatan Anda:</h4>
                        <textarea id="catatan-input" placeholder="Tulis catatan di sini" rows="5">${modalSelection.catatan}</textarea>
                    </div>
                `;
            }

            let existingProgressHTML = '';
            if (currentData.length > 0) {
                let items = currentData.map(item => 
                    `<p>• <b>${item.surahName}</b> (Juz ${item.juzId}): ${item.catatan}</p>`
                ).join('');
                existingProgressHTML = `<div class="existing-progress-view"><h4>Progress di ${selectedDate} sebelumnya:</h4>${items}</div>`;
            }

            const deleteButtonPerDateHTML = currentData.length > 0 && modalStep !== 'REVIEW' ? 
                `<button class="delete-button" onclick="deleteProgress()">Hapus Data di Tanggal Ini</button>` : '';

            let footerContentHTML = '';
            if (modalStep === 'REVIEW') {
                footerContentHTML = `<div class="review-controls-footer">
                    <button class="back-button" onclick="setStep('SURAH')">Pilih Surah Lain</button>
                    <button class="save-button" id="save-progress-btn">Simpan Catatan</button>
                </div>`;
            }
            
            const footerHTML = `
                <div class="modal-footer">
                    ${modalStep !== 'REVIEW' ? deleteButtonPerDateHTML : ''}
                    <div class="review-controls-footer">
                       ${footerContentHTML}
                    </div>
                </div>
            `;
            
            const modalHTML = `
                <div class="modal-overlay">
                    <div class="modal-content large-modal">
                        <header class="modal-header">
                            <h2>${selectedDate}</h2>
                            <button class="close-button" onclick="closeModal()">&times;</button>
                        </header>
                        <div class="modal-body">${contentHTML}${existingProgressHTML}</div>
                        ${footerHTML}
                    </div>
                </div>
            `;
            root.innerHTML = modalHTML;
            attachModalListeners();
        }
        
        function renderApp() {
            renderCalendarNav();
            renderCalendar();
            renderModal();
        }

        // --- E. Fungsi Info & Privacy (Teks Rapi) ---
        
        function showAboutWebsite() {
            const policyText = `
                <h2>Tentang Website MurojaahKu & Fiturnya</h2>
                <p>MurojaahKu adalah aplikasi web sederhana yang berfungsi sebagai pelacak (tracker) kemajuan Muroja'ah (mengulang hafalan) Al-Qur'an Anda.</p>
                <p>Tujuan utama website ini adalah menyediakan antarmuka yang cepat dan privat untuk mencatat bagian Al-Qur'an yang telah Anda ulang atau baca pada hari tertentu.</p>
                
                <h3>Fitur-Fitur Utama:</h3>
                <ol>
                    <li><b>Pelacakan Kalender:</b> Anda dapat melihat hari-hari mana saja Anda telah melakukan Muroja'ah (ditandai dengan centang hijau).</li>
                    <li><b>Navigasi Bulan/Tahun:</b> Tombol panah memungkinkan Anda mengganti bulan satu per satu. Mengklik nama bulan/tahun memungkinkan Anda memilih tanggal secara instan melalui dropdown.</li>
                    <li><b>Tombol Hari Ini:</b> Mengarahkan kalender kembali ke tanggal hari ini secara instan, sangat berguna jika Anda sudah menjelajahi bulan atau tahun yang jauh.</li>
                    <li><b>Pilihan Juz & Surah Lengkap:</b> Memungkinkan Anda memilih Juz dan Surah yang telah Anda Muroja'ah.</li>
                    <li><b>Integrasi API Al-Qur'an:</b> Saat memilih Surah, aplikasi mengambil teks Arab yang benar dan lengkap langsung dari API Al-Qur'an publik (memerlukan koneksi internet).</li>
                    <li><b>Pencatatan Lokal:</b> Setiap catatan dan progress tersimpan aman di browser Anda.</li>
                    <li><b>Hapus Data Global & Harian:</b> Kontrol penuh untuk menghapus data Anda kapan saja.</li>
                </ol>
            `;
            
            showInfoModal("Tentang Website & Fitur", policyText);
        }

        function showPrivacyPolicy() {
            const policyText = `
                <h2>Kebijakan Privasi MurojaahKu</h2>
                <p>Aplikasi ini dibuat murni untuk membantu Anda melacak Muroja'ah Anda dengan prinsip privasi penuh.</p>
                
                <h3>1. Privasi Data (Local Storage)</h3>
                <ul>
                    <li>Semua data progress dan catatan Muroja'ah yang Anda masukkan <b>hanya tersimpan di browser perangkat Anda sendiri</b> (menggunakan Local Storage).</li>
                    <li>Aplikasi <b>TIDAK mengumpulkan, mengirim, atau menyimpan data Anda di server eksternal</b> manapun.</li>
                    <li>Kami tidak memiliki akses, dan tidak dapat melihat, data Anda. Jika Anda menghapus cache atau Local Storage browser, data Anda akan hilang.</li>
                </ul>
                
                <h3>2. Koneksi API Al-Qur'an</h3>
                <ul>
                    <li>Aplikasi ini menggunakan API Al-Qur'an publik untuk menampilkan teks Arab yang benar dan lengkap (misalnya, dari api.alquran.cloud).</li>
                    <li>Saat Anda memilih surah, browser Anda akan <b>mengirim permintaan ke API pihak ketiga tersebut</b> untuk mengambil teks Arab.</li>
                    <li>Koneksi internet diperlukan agar fitur tampilan teks Al-Qur'an berfungsi dengan benar.</li>
                </ul>
            `;
            
            showInfoModal("Privacy Policy", policyText);
        }
        
        function showInfoModal(title, content) {
            const modalRoot = document.getElementById('modal-root');
            // Menutup modal entri data jika sedang terbuka
            isModalOpen = false;
            
            modalRoot.innerHTML = `
                <div class="modal-overlay" onclick="closeInfoModal(event)">
                    <div class="modal-content large-modal">
                        <header class="modal-header">
                            <h3>${title}</h3>
                            <button class="close-button" onclick="closeInfoModal()">&times;</button>
                        </header>
                        <div class="modal-body">${content}</div>
                    </div>
                </div>
            `;
            renderApp(); // Render ulang untuk memastikan modal entri data tertutup
        }
        
        function closeInfoModal(event) {
            if (!event || event.target.classList.contains('modal-overlay') || event.target.classList.contains('close-button')) {
                document.getElementById('modal-root').innerHTML = '';
            }
        }

        // --- F. Event Handlers dan Initial Load ---

        function handleDateClick(date) {
            selectedDate = date;
            isModalOpen = true;
            modalStep = 'JUZ';
            modalSelection = { juz: null, surah: null, catatan: '' };
            renderApp();
        }

        function closeModal() {
            isModalOpen = false;
            selectedDate = '';
            renderApp();
        }
        
        // ... (Fungsi setStep, saveProgress, attachModalListeners, deleteAllData, deleteProgress tetap sama)

        // --- G. Initial App Load ---
        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
